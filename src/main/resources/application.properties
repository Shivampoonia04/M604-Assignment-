spring.application.name=wingbook

spring.datasource.url=jdbc:mysql://localhost:3307/wingbook?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=wing_user
spring.datasource.password=wing_slot_92
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8088
server.error.include-message=always

# Campus quiet hours (no new slots starting in this window)
wingbook.quiet-hours-start=22
wingbook.quiet-hours-end=7
wingbook.max-slot-minutes=90
