services:
  mysql:
    image: mysql:8.4
    container_name: wingbook-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wingbook
      MYSQL_USER: wing_user
      MYSQL_PASSWORD: wing_slot_92
    ports:
      - "3307:3306"
    volumes:
      - wingbook_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wingbook_mysql_data:
